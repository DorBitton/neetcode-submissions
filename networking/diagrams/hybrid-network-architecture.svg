<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace,monospace" font-size="11">
  <title>Hybrid Network Architecture — On-Prem + AWS, 2 Subnets</title>
  <desc>Side-by-side diagram showing on-prem (F5, VIP, DMZ, private subnet) and AWS (CloudFront, ALB, public/private subnets) connected via Direct Connect / VPN</desc>

  <!-- Background -->
  <rect width="960" height="720" fill="#0d1117"/>

  <!-- ── LABELS ── -->
  <text x="235" y="22" fill="#8b949e" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">ON-PREM</text>
  <text x="725" y="22" fill="#8b949e" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">AWS</text>

  <!-- Divider -->
  <line x1="480" y1="10" x2="480" y2="710" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- INTERNET -->
  <rect x="385" y="32" width="190" height="44" rx="8" fill="#1c2333" stroke="#388bfd" stroke-width="1.5"/>
  <text x="480" y="51" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">INTERNET</text>
  <text x="480" y="67" fill="#8b949e" font-size="10" text-anchor="middle">BGP / Public IPs</text>

  <!-- Arrow: Internet → Router -->
  <line x1="420" y1="76" x2="235" y2="118" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Router -->
  <rect x="145" y="118" width="180" height="44" rx="6" fill="#1c2333" stroke="#d29922" stroke-width="1.5"/>
  <text x="235" y="136" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Edge Router</text>
  <text x="235" y="152" fill="#8b949e" font-size="10" text-anchor="middle">BGP to ISP · ASN</text>

  <!-- Arrow: Router → Firewall -->
  <line x1="235" y1="162" x2="235" y2="198" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Firewall -->
  <rect x="145" y="198" width="180" height="44" rx="6" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="235" y="216" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">Firewall / ACL</text>
  <text x="235" y="232" fill="#8b949e" font-size="10" text-anchor="middle">ingress · egress rules</text>

  <!-- Arrow: Firewall → F5 -->
  <line x1="235" y1="242" x2="235" y2="278" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- F5 -->
  <rect x="120" y="278" width="230" height="52" rx="6" fill="#1c2333" stroke="#bc8cff" stroke-width="2"/>
  <text x="235" y="299" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">F5 BIG-IP</text>
  <text x="235" y="315" fill="#8b949e" font-size="10" text-anchor="middle">VIP :443 · TLS termination · iRules</text>
  <rect x="128" y="322" width="55" height="18" rx="3" fill="#21262d" stroke="#bc8cff" stroke-width="1"/>
  <text x="155" y="335" fill="#d2a8ff" font-size="9" text-anchor="middle">VIP :443</text>
  <rect x="193" y="322" width="70" height="18" rx="3" fill="#21262d" stroke="#bc8cff" stroke-width="1"/>
  <text x="228" y="335" fill="#d2a8ff" font-size="9" text-anchor="middle">SSL offload</text>
  <rect x="273" y="322" width="65" height="18" rx="3" fill="#21262d" stroke="#bc8cff" stroke-width="1"/>
  <text x="305" y="335" fill="#d2a8ff" font-size="9" text-anchor="middle">mTLS certs</text>

  <!-- Arrow: F5 → Core Switch -->
  <line x1="235" y1="342" x2="235" y2="372" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Core Switch -->
  <rect x="155" y="372" width="160" height="36" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="235" y="387" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">Core Switch / L3</text>
  <text x="235" y="401" fill="#8b949e" font-size="10" text-anchor="middle">VLANs · routing between subnets</text>

  <!-- PUBLIC SUBNET (DMZ) -->
  <rect x="30" y="426" width="185" height="120" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="122" y="443" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">PUBLIC SUBNET / DMZ</text>
  <text x="122" y="457" fill="#8b949e" font-size="9" text-anchor="middle">10.0.1.0/24</text>
  <rect x="46" y="464" width="68" height="32" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="478" fill="#c9d1d9" font-size="9" text-anchor="middle">Web :80</text>
  <text x="80" y="490" fill="#8b949e" font-size="8" text-anchor="middle">nginx/apache</text>
  <rect x="126" y="464" width="68" height="32" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="478" fill="#c9d1d9" font-size="9" text-anchor="middle">Web :80</text>
  <text x="160" y="490" fill="#8b949e" font-size="8" text-anchor="middle">nginx/apache</text>
  <rect x="46" y="504" width="148" height="28" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="120" y="516" fill="#e3b341" font-size="9" font-weight="700" text-anchor="middle">NAT / PAT</text>
  <text x="120" y="528" fill="#8b949e" font-size="8" text-anchor="middle">outbound internet for hosts</text>

  <!-- PRIVATE SUBNET (on-prem) -->
  <rect x="230" y="426" width="205" height="150" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="332" y="443" fill="#79c0ff" font-size="10" font-weight="700" text-anchor="middle">PRIVATE SUBNET</text>
  <text x="332" y="457" fill="#8b949e" font-size="9" text-anchor="middle">10.0.2.0/24 · no direct internet</text>
  <rect x="246" y="464" width="68" height="32" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="478" fill="#c9d1d9" font-size="9" text-anchor="middle">App :8080</text>
  <text x="280" y="490" fill="#8b949e" font-size="8" text-anchor="middle">app server</text>
  <rect x="326" y="464" width="68" height="32" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="478" fill="#c9d1d9" font-size="9" text-anchor="middle">App :8080</text>
  <text x="360" y="490" fill="#8b949e" font-size="8" text-anchor="middle">app server</text>
  <rect x="246" y="506" width="148" height="30" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="320" y="519" fill="#ff7b72" font-size="9" font-weight="700" text-anchor="middle">Database :5432</text>
  <text x="320" y="531" fill="#8b949e" font-size="8" text-anchor="middle">PostgreSQL · private only</text>
  <rect x="246" y="544" width="148" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="560" fill="#8b949e" font-size="8" text-anchor="middle">Monitoring / Jump Host</text>

  <!-- Switch → DMZ -->
  <line x1="200" y1="408" x2="122" y2="426" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Switch → Private -->
  <line x1="265" y1="408" x2="332" y2="426" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- AWS SIDE -->

  <!-- Arrow: Internet → CloudFront -->
  <line x1="540" y1="76" x2="620" y2="118" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow: Internet → IGW -->
  <line x1="575" y1="76" x2="725" y2="118" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CloudFront -->
  <rect x="530" y="118" width="160" height="44" rx="6" fill="#1c2333" stroke="#e3b341" stroke-width="1.5"/>
  <text x="610" y="136" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">CloudFront CDN</text>
  <text x="610" y="152" fill="#8b949e" font-size="10" text-anchor="middle">edge PoPs · TLS · cache</text>

  <!-- IGW -->
  <rect x="708" y="118" width="160" height="44" rx="6" fill="#1c2333" stroke="#d29922" stroke-width="1.5"/>
  <text x="788" y="136" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Internet Gateway</text>
  <text x="788" y="152" fill="#8b949e" font-size="10" text-anchor="middle">VPC inbound/outbound</text>

  <!-- VPC border -->
  <rect x="510" y="185" width="430" height="500" rx="10" fill="none" stroke="#d29922" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="725" y="200" fill="#e3b341" font-size="10" font-weight="600" text-anchor="middle">VPC  172.16.0.0/16</text>

  <!-- Route Table note -->
  <rect x="820" y="205" width="105" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="872" y="219" fill="#8b949e" font-size="9" font-weight="700" text-anchor="middle">Route Tables</text>
  <text x="872" y="232" fill="#8b949e" font-size="8" text-anchor="middle">0.0.0.0/0 → IGW</text>

  <!-- CF → ALB -->
  <line x1="610" y1="162" x2="660" y2="256" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- IGW → ALB area -->
  <line x1="788" y1="162" x2="740" y2="256" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PUBLIC SUBNET AWS -->
  <rect x="520" y="256" width="390" height="140" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="715" y="274" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">PUBLIC SUBNET</text>
  <text x="715" y="288" fill="#8b949e" font-size="9" text-anchor="middle">172.16.1.0/24 · us-east-1a / 1b</text>

  <!-- ALB -->
  <rect x="535" y="296" width="175" height="44" rx="6" fill="#21262d" stroke="#bc8cff" stroke-width="2"/>
  <text x="622" y="315" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">ALB</text>
  <text x="622" y="330" fill="#8b949e" font-size="9" text-anchor="middle">:443 · listener rules · ACM cert</text>
  <rect x="535" y="346" width="175" height="18" rx="3" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="622" y="359" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">Security Group · :443 from 0.0.0.0/0</text>

  <!-- NAT GW -->
  <rect x="730" y="296" width="160" height="44" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="810" y="315" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">NAT Gateway</text>
  <text x="810" y="330" fill="#8b949e" font-size="9" text-anchor="middle">Elastic IP · outbound only</text>
  <rect x="730" y="346" width="160" height="18" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="810" y="359" fill="#8b949e" font-size="8.5" text-anchor="middle">private subnet → NAT → internet</text>

  <!-- ALB → EC2 -->
  <line x1="622" y1="366" x2="622" y2="416" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- NAT GW → private -->
  <line x1="810" y1="366" x2="810" y2="416" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PRIVATE SUBNET AWS -->
  <rect x="520" y="416" width="390" height="200" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="715" y="434" fill="#79c0ff" font-size="10" font-weight="700" text-anchor="middle">PRIVATE SUBNET</text>
  <text x="715" y="448" fill="#8b949e" font-size="9" text-anchor="middle">172.16.2.0/24 · no IGW route</text>

  <rect x="535" y="456" width="80" height="40" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="575" y="472" fill="#c9d1d9" font-size="9" text-anchor="middle">EC2</text>
  <text x="575" y="485" fill="#8b949e" font-size="8" text-anchor="middle">:8080 app</text>
  <rect x="630" y="456" width="80" height="40" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="472" fill="#c9d1d9" font-size="9" text-anchor="middle">EC2</text>
  <text x="670" y="485" fill="#8b949e" font-size="8" text-anchor="middle">:8080 app</text>

  <rect x="535" y="508" width="175" height="36" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="622" y="522" fill="#ff7b72" font-size="9" font-weight="700" text-anchor="middle">RDS / Aurora :5432</text>
  <text x="622" y="536" fill="#8b949e" font-size="8" text-anchor="middle">Multi-AZ · private only</text>

  <rect x="535" y="552" width="175" height="18" rx="3" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="622" y="565" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">Security Group · :8080 from ALB SG only</text>

  <rect x="725" y="456" width="165" height="56" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="807" y="472" fill="#c9d1d9" font-size="9" font-weight="700" text-anchor="middle">IAM Role on EC2</text>
  <text x="807" y="486" fill="#8b949e" font-size="8" text-anchor="middle">access S3 / SSM / Secrets</text>
  <text x="807" y="498" fill="#8b949e" font-size="8" text-anchor="middle">no credentials in code</text>

  <rect x="725" y="522" width="165" height="30" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="807" y="535" fill="#8b949e" font-size="8" font-weight="700" text-anchor="middle">Route Table (private)</text>
  <text x="807" y="548" fill="#8b949e" font-size="8" text-anchor="middle">0.0.0.0/0 → NAT GW</text>

  <!-- DIRECT CONNECT / VPN -->
  <rect x="370" y="596" width="220" height="42" rx="6" fill="#1c2333" stroke="#388bfd" stroke-width="2"/>
  <text x="480" y="614" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">Direct Connect / VPN</text>
  <text x="480" y="629" fill="#8b949e" font-size="10" text-anchor="middle">BGP · encrypted tunnel · private IPs</text>

  <!-- On-prem private → DC -->
  <line x1="332" y1="576" x2="390" y2="596" stroke="#388bfd" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arb)"/>
  <!-- DC → AWS private -->
  <line x1="590" y1="596" x2="650" y2="576" stroke="#388bfd" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arb)"/>

  <!-- LEGEND -->
  <rect x="16" y="642" width="440" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="658" fill="#8b949e" font-size="9" font-weight="700">LEGEND</text>
  <rect x="28" y="664" width="10" height="10" rx="2" fill="none" stroke="#2ea043" stroke-width="1.5"/>
  <text x="44" y="674" fill="#8b949e" font-size="9">Public subnet (internet-facing)</text>
  <rect x="28" y="680" width="10" height="10" rx="2" fill="none" stroke="#388bfd" stroke-width="1.5"/>
  <text x="44" y="690" fill="#8b949e" font-size="9">Private subnet (no direct internet)</text>
  <rect x="160" y="664" width="10" height="10" rx="2" fill="none" stroke="#bc8cff" stroke-width="2"/>
  <text x="176" y="674" fill="#8b949e" font-size="9">Load balancer (F5 / ALB) — TLS terminates here</text>
  <rect x="160" y="680" width="10" height="10" rx="2" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <text x="176" y="690" fill="#8b949e" font-size="9">Security boundary (firewall / SG)</text>
  <line x1="324" y1="658" x2="344" y2="658" stroke="#388bfd" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="350" y="663" fill="#8b949e" font-size="9">Direct Connect / VPN</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#388bfd"/>
    </marker>
  </defs>
</svg>
